  --bg:oklch(98.5% .003 30);
  --surface:oklch(100% 0 0);
  --surface-2:oklch(95.5% .006 30);
  --ink:oklch(17% .01 30);
  --muted:oklch(44% .01 30);
  --line:oklch(88% .006 30);
  --brand:oklch(52% .22 27);
  --brand-ink:#fff;
  --accent:oklch(54% .22 27);
  --accent-ink:#fff;
  --accent-2:oklch(74% .17 58);
  --accent-text:oklch(50% .21 27);
  --ok:oklch(48% .13 155);
  --shadow:0 1px 2px oklch(20% .04 260/.06),0 8px 24px oklch(20% .04 260/.08);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:oklch(13% 0 0);
  --surface:oklch(19% .006 25);
  --surface-2:oklch(24% .01 25);
  --ink:oklch(97% 0 0);
  --muted:oklch(78% .008 25);
  --line:oklch(32% .012 25);
  --brand:oklch(58% .23 27);
  --brand-ink:#fff;
  --accent:oklch(58% .23 27);
  --accent-ink:#fff;
  --accent-2:oklch(76% .17 58);
  --accent-text:oklch(76% .17 50);
  --ok:oklch(78% .14 155);
  --shadow:0 1px 2px oklch(0% 0 0/.3),0 8px 24px oklch(0% 0 0/.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden;transition:background .3s var(--ease),color .3s var(--ease)}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:700;line-height:1.1;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* HEADER */
header{position:sticky;top:0;z-index:50;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Fraunces',serif;font-weight:700;font-size:1.25rem;color:var(--ink)}
.logo img{height:48px;width:auto;border-radius:10px;display:block;background:#000}
.logo span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tools{display:flex;align-items:center;gap:8px}
.tbtn{height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:.88rem;transition:transform .2s var(--ease),border-color .2s}
.tbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.tbtn svg{width:18px;height:18px}
select.tbtn{appearance:none;padding-right:12px;cursor:pointer}
#themeBtn .moon{display:none}
:root[data-theme="dark"] #themeBtn .sun{display:none}
:root[data-theme="dark"] #themeBtn .moon{display:block}

/* PRELOADER: el zapato llega con fuego, frena al centro y se va */
#pre{display:none;position:fixed;inset:0;z-index:100;background:#000;place-items:center;overflow:hidden;transition:opacity .55s ease,transform .55s var(--ease);animation:preFail 0s 6s forwards}
html.pre #pre{display:grid}
html.pre{overflow:hidden}
#pre.out{opacity:0;transform:scale(1.06);pointer-events:none}
@keyframes preFail{to{visibility:hidden}}
.pre-stage{position:relative;width:min(84vw,440px);aspect-ratio:742/687}
.pre-stage i{position:absolute;display:block;pointer-events:none}
.pre-shoe,.pre-word{inset:0;background:var(--logo) center/100% 100% no-repeat}
.pre-shoe{clip-path:inset(0 0 54.1% 0);animation:preShoe 1.05s cubic-bezier(.1,.85,.2,1) both;will-change:transform}
.pre-word{clip-path:inset(45.9% 0 0 0);animation:preWord .6s var(--ease) .9s both}
.pre-fire{left:-70%;top:30%;width:78%;height:24%;background:linear-gradient(90deg,transparent,rgba(255,60,0,.85) 35%,#ff9a00 72%,#fff1b8);border-radius:50%;filter:blur(7px);transform-origin:100% 50%;animation:preFire 1.05s ease-out both;will-change:transform,opacity}
.pre-glow{inset:6% 0 0;background:radial-gradient(closest-side,rgba(255,70,0,.55),transparent 72%);opacity:0;animation:preGlow 1.2s ease-out .55s both}
@keyframes preShoe{0%{transform:translate3d(-135vw,0,0) skewX(-20deg)}55%{transform:translate3d(4%,0,0) skewX(-7deg)}75%{transform:translate3d(-1.5%,0,0) skewX(2deg)}100%{transform:none}}
@keyframes preFire{0%{opacity:0;transform:translate3d(-135vw,0,0) scaleX(1.6)}12%{opacity:1}55%{opacity:1;transform:translate3d(4%,0,0) scaleX(1.5)}100%{opacity:0;transform:translate3d(0,0,0) scaleX(.15)}}
@keyframes preWord{from{opacity:0;transform:translate3d(0,8%,0) scale(.96)}to{opacity:1;transform:none}}
@keyframes preGlow{0%{opacity:0}45%{opacity:.9}100%{opacity:.35}}
/* el hero espera a que el preloader se vaya */
html.pre .stage-word,html.pre .stage-shoe,html.pre .stage-glow{animation-play-state:paused}

/* HERO */
html,body{overflow-x:clip}
.hero{position:relative;overflow:hidden}
.eyebrow{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);margin-bottom:14px}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);margin-bottom:16px}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin-bottom:24px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:0;font-weight:700;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in oklab,var(--accent) 40%,transparent)}
.btn-primary:hover{background:color-mix(in oklab,var(--accent) 85%,#fff)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-wa{background:oklch(52% .15 155);color:#fff;width:100%}
.hero{background:#000;color:#fff;padding:32px 0 48px}
.hero-grid{position:relative;z-index:2;display:flex;flex-direction:column-reverse;gap:8px;min-height:0;min-width:0}
.hero-copy{min-width:0}
.hero h1{overflow-wrap:break-word;font-size:clamp(2rem,9vw,4rem)}
.hero h1{color:#fff}
.hero .eyebrow{color:oklch(78% .17 58);display:block}
.hero .btn-ghost{color:#fff;border-color:rgba(255,255,255,.7)}
.stage{position:relative;width:min(100%,460px);margin:-6% auto -12%;aspect-ratio:742/687}
.stage i{position:absolute;inset:0;display:block;background:var(--logo) center/100% 100% no-repeat;pointer-events:none}
.stage-word{clip-path:inset(45.9% 0 0 0);animation:wordIn .9s var(--ease) .15s both}
.stage-shoe{clip-path:inset(0 0 54.1% 0);animation:shoeIn 1.25s var(--ease) both;will-change:transform,opacity}
.stage-glow{position:absolute;inset:8% 4% 4%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--accent) 55%,transparent),transparent 72%);opacity:0;animation:glowIn 1.6s ease-out .4s forwards}
@keyframes shoeIn{0%{opacity:0;transform:translate3d(-38%,3%,0) skewX(-14deg) scale(.94);filter:blur(7px)}55%{opacity:1;filter:blur(0)}78%{transform:translate3d(1.6%,0,0) skewX(1.5deg) scale(1)}100%{opacity:1;transform:none;filter:none}}
@keyframes wordIn{from{opacity:0;transform:translate3d(0,6%,0) scale(.96)}to{opacity:1;transform:none}}
@keyframes glowIn{to{opacity:.5}}
@media(min-width:860px){.hero{padding:48px 0 64px}.hero-grid{flex-direction:row;align-items:center;gap:32px}.hero-copy{flex:1 1 50%}.stage{flex:1 1 50%;width:auto;max-width:540px;margin:0}}
@media(prefers-reduced-motion:reduce){.stage-word,.stage-shoe,.stage-glow{animation:none}.stage-glow{opacity:.35}}
.badge-float{display:table;margin-bottom:14px;background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#111;padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:700}

/* PERKS */
.perks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 0 24px}
.perk{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:18px 18px 16px}
.perk h3{font-family:'Fraunces',serif;font-weight:700;font-size:1.08rem;margin:0 0 4px}
.perk p{font-size:.88rem;color:var(--muted);line-height:1.5}
@media(min-width:760px){.perks{grid-template-columns:repeat(4,1fr)}}

/* CARRITO, TOAST, LIGHTBOX */
.cart-fab{position:fixed;right:16px;bottom:16px;z-index:60;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35);display:grid;place-items:center}
.cart-fab[hidden]{display:none}
.cart-fab svg{width:26px;height:26px}
.cart-fab span{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:#fff;color:#111;font-size:.78rem;font-weight:800;display:grid;place-items:center}
.cart-fab.bump{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.18)}}
.cart-panel{max-width:520px}
.cart-in{padding:24px 20px 24px;display:grid;gap:14px}
.cart-in h2{font-size:1.6rem;padding-right:44px}

function buildMedia(imgs,vids){
  const media=[],used=new Set();
  imgs.forEach((im,i)=>{
    media.push({type:"img",src:im.src,thumb:im.thumb,color:im.color,price:im.price,name:im.name});
    const lastOfColor=!!im.color&&!imgs.slice(i+1).some(x=>x.color===im.color);
    vids.forEach((v,j)=>{
      if(used.has(j))return;
      if(v.after?v.after===im.path:(v.color&&v.color===im.color&&lastOfColor)){used.add(j);media.push({type:"vid",src:v.src,color:v.color??im.color,price:im.price,name:im.name})}
    });
  });
  vids.forEach((v,j)=>{if(!used.has(j))media.push({type:"vid",src:v.src,color:v.color,price:null,name:""})});
  return media;
}

function vidInfo(u){
  u=String(u||"");let m;
  if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/))return{name:"YouTube",url:`https://www.youtube-nocookie.com/embed/${m[1]}?playsinline=1&rel=0&modestbranding=1`,tall:/\/shorts\//.test(u)};
  if(m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]+)/))return{name:"Google Drive",url:`https://drive.google.com/file/d/${m[1]}/preview`,tall:false};
  if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))return{name:"Vimeo",url:`https://player.vimeo.com/video/${m[1]}`,tall:false};
  if(m=u.match(/instagram\.com\/(?:[^\/]+\/)?(?:reel|reels|p|tv)\/([\w-]+)/))return{name:"Instagram",url:`https://www.instagram.com/reel/${m[1]}/embed`,ig:true,tall:false};
  return null;
}
function lbItems(p){return p.media&&p.media.length?p.media.map(m=>m.type==="img"?m.src:{video:m.src,info:vidInfo(m.src)}):[{svg:shoe(p.type,p.c,"lb"+p.id)}]}
function curPrice(p){
  const im=p.media&&p.media[state.gi];if(im&&im.price)return im.price;
  if(state.color){const x=(p.media||[]).find(i=>i.type==="img"&&i.color===state.color&&i.price);if(x)return x.price}
  return p.price;
}
function curName(p){
  const im=p.media&&p.media[state.gi];if(im&&im.name)return im.name;
  if(state.color){const x=(p.media||[]).find(i=>i.type==="img"&&i.color===state.color&&i.name);if(x)return x.name}
  return p.name;
}
function drawName(p){$("#mName").textContent=curName(p)}
function drawPrice(p){const v=curPrice(p);$("#mPrice").innerHTML=fmt(v)+(p.old&&v===p.price?`<span class="old">${fmt(p.old)}</span>`:"")}
function drawGallery(p){
  const w=$("#mImg");w.innerHTML="";
  const m=document.createElement("div");m.className="m-main";
  const md=p.media||[],cur=md[state.gi];
  if(cur&&cur.type==="vid"){
    m.classList.add("is-video");
    const vi=vidInfo(cur.src);
    if(vi){
      /* Enlace de YouTube / Drive / Vimeo: el video se carga solo al tocar la miniatura (no pesa en la página) */
      const box=document.createElement("div");box.className=vi.ig?"ig-crop":"v-embed"+(vi.tall?" tall":"");
      const f=document.createElement("iframe");f.src=vi.url;f.title="Video";f.referrerPolicy="strict-origin-when-cross-origin";f.setAttribute("allow","autoplay; fullscreen; picture-in-picture");f.setAttribute("allowfullscreen","");if(vi.ig)f.setAttribute("scrolling","no");
      box.appendChild(f);m.appendChild(box);
    }else{
      const v=document.createElement("video");v.src=cur.src;v.controls=true;v.playsInline=true;v.preload="none";
      const pj=md.find(x=>x.type==="img"&&cur.color&&x.color===cur.color)||md.find(x=>x.type==="img");if(pj)v.poster=pj.src;
      v.setAttribute("controlslist","nodownload noremoteplayback");v.setAttribute("disablepictureinpicture","");
      m.appendChild(v);
    }
    const ex=document.createElement("button");ex.type="button";ex.className="m-expand";ex.setAttribute("aria-label","⤢");ex.textContent="⤢";
    ex.onclick=()=>openLb(lbItems(p),state.gi,i=>{state.gi=i;drawGallery(p)});m.appendChild(ex);
  }else{
    m.innerHTML=cur?`<img class="photo" src="${cur.src}" alt="" decoding="async">`:shoe(p.type,p.c,"m"+p.id);
    m.onclick=()=>openLb(lbItems(p),state.gi,i=>{state.gi=i;drawGallery(p)});
  }
  w.appendChild(m);drawPrice(p);drawName(p);
  if(md.length>1){
    const th=document.createElement("div");th.className="thumbs";
    md.forEach((x,i)=>{
      const b=document.createElement("button");b.type="button";b.className="thumb"+(x.type==="vid"?" vid":"");b.setAttribute("aria-pressed",i===state.gi);
      if(x.type==="img")b.innerHTML=`<img src="${x.thumb||x.src}" alt="" loading="lazy" decoding="async">`;
      else{
        const c=colorsOf(p).find(c=>c.id===x.color);b.setAttribute("aria-label","Video");
        b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>'+(c?`<i style="background:${c.hex}"></i>`:"");
      }
      b.onclick=()=>{state.gi=i;if(x.color&&colorsOf(p).some(c=>c.id===x.color)){state.color=x.color;fillColors(p)}drawGallery(p)};
      th.appendChild(b);
    });
    w.appendChild(th);
  }
}
function colorsOf(p){return (p.colorIds||[]).map(id=>COLORS.find(c=>c.id===id)).filter(Boolean)}
function fillColors(p){
  const l=colorsOf(p),box=$("#colorBox"),w=$("#swatches");

/* ---------- Lightbox ---------- */
let lbList=[],lbI=0;
let lbSync=null;
function openLb(list,i,sync){
  lbSync=sync||null;lbList=list;lbI=i||0;drawLb();$("#lb").hidden=false;$("#lbX").focus();
}
function drawLb(){
  const it=lbList[lbI],b=$("#lbBody");
  b.innerHTML="";
  if(typeof it==="string")b.innerHTML=`<img src="${it}" alt="">`;
  else if(it.svg)b.innerHTML=it.svg;
  else if(it.info){
    const box=document.createElement("div");box.className=it.info.ig?"ig-crop ig-lb":"v-embed lbv"+(it.info.tall?" tall":"");
    const f=document.createElement("iframe");f.src=it.info.url;f.title="Video";f.referrerPolicy="strict-origin-when-cross-origin";f.setAttribute("allow","autoplay; fullscreen; picture-in-picture");f.setAttribute("allowfullscreen","");
    box.appendChild(f);b.appendChild(box);
  }else{
    const v=document.createElement("video");v.src=it.video;v.controls=true;v.autoplay=true;v.playsInline=true;
    v.setAttribute("controlslist","nodownload noremoteplayback");b.appendChild(v);
  }
  $("#lbPrev").hidden=$("#lbNext").hidden=lbList.length<2;
}
function closeLb(){$("#lb").hidden=true;$("#lbBody").innerHTML="";if(lbSync){const f=lbSync;lbSync=null;f(lbI)}}
$("#lbX").onclick=closeLb;
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb"||e.target.id==="lbBody")closeLb()});
$("#lbPrev").onclick=()=>{lbI=(lbI-1+lbList.length)%lbList.length;drawLb()};
$("#lbNext").onclick=()=>{lbI=(lbI+1)%lbList.length;drawLb()};
document.addEventListener("keydown",e=>{

let cart=(store.get("cart",[])||[]).filter(i=>i&&i.id&&i.size&&i.qty>0);
const priceOf=i=>i.price;
const nameOf=i=>i.name;
function saveCart(){store.set("cart",cart);renderCart()}
let toastT;
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),1800)}
function checkPick(p){
  const cl=colorsOf(p);
  if(!p.sizes.length){$("#warn").textContent=t("soldOut");return null}
  if(!state.size){$("#warn").textContent=t("needSize");return null}
  if(cl.length&&!state.color){$("#warn").textContent=t("needColor");return null}
  return cl.find(c=>c.id===state.color)||null;
}
$("#mAdd").onclick=()=>{
  const p=state.current;if(!p)return;
  const picked=checkPick(p);if(!p.sizes.length||!state.size||(colorsOf(p).length&&!state.color))return;
  const k=i=>i.id+"|"+i.size+"|"+(i.color||0)+"|"+i.price+"|"+i.name,n={id:p.id,name:curName(p),price:curPrice(p),size:state.size,color:picked?picked.id:0,colorName:picked?picked.name:"",qty:1};
  const ex=cart.find(i=>k(i)===k(n));
  ex?ex.qty=Math.min(10,ex.qty+1):cart.push(n);
  saveCart();toast(t("cartAdded"));
  const f=$("#cartBtn");f.classList.remove("bump");void f.offsetWidth;f.classList.add("bump");
};
function renderCart(){
  const n=cart.reduce((a,i)=>a+i.qty,0),f=$("#cartBtn");
  f.hidden=!n;$("#cartCount").textContent=n;
  const l=$("#cartList");l.innerHTML="";
  cart.forEach((i,ix)=>{
    const r=document.createElement("div");r.className="cart-row";
    r.innerHTML=`<b></b><span class="cr-p"></span><small></small><button class="cr-x" type="button"></button><div class="qty"><button type="button" aria-label="−">−</button><span></span><button type="button" aria-label="+">+</button></div>`;
    r.querySelector("b").textContent=nameOf(i);
    r.querySelector(".cr-p").textContent=fmt(priceOf(i)*i.qty);
    r.querySelector("small").textContent=`${t("sizeW")} ${i.size}`+(i.colorName?` · ${i.colorName}`:"");
    r.querySelector(".cr-x").textContent=t("cartRemove");
    r.querySelector(".cr-x").onclick=()=>{cart.splice(ix,1);saveCart()};
    const [m,q,pl]=r.querySelector(".qty").children;q.textContent=i.qty;
    m.onclick=()=>{i.qty>1?i.qty--:cart.splice(ix,1);saveCart()};
    pl.onclick=()=>{i.qty=Math.min(10,i.qty+1);saveCart()};
    l.appendChild(r);
  });
  const total=cart.reduce((a,i)=>a+priceOf(i)*i.qty,0);
  $("#cartSum").textContent=fmt(total);
  $("#cartEmpty").hidden=!!cart.length;$(".cart-total").hidden=!cart.length;$("#cartOrder").hidden=!cart.length;
  $("#cartOrder").href="#";
  if(!cart.length)$("#cartOv").classList.remove("open");
}
function cartMsg(sh){
  const total=cart.reduce((a,i)=>a+priceOf(i)*i.qty,0);
  const lines=cart.map((i,ix)=>`${ix+1}. ${nameOf(i)} · ${t("sizeW")} ${i.size}${i.colorName?" · "+i.colorName:""} · x${i.qty} · ${fmt(priceOf(i)*i.qty)}`);
  return [t("cartHello"),...lines,"",`${t("cartTotal")}: ${fmt(total)}`,shipLine(sh)].join("\n");

  const avg=l.reduce((a,x)=>a+x.r,0)/(l.length||1);
  $("#avg").textContent=l.length?avg.toFixed(1):"–";
  $("#avgStars").textContent=l.length?"★".repeat(Math.round(avg))+"☆".repeat(5-Math.round(avg)):"";
  $("#avgCount").textContent=l.length?t("revCount")(l.length):t("revNone");
}
function renderRate(){
  const c=$("#rate");c.innerHTML="";
  for(let i=1;i<=5;i++){
    const b=document.createElement("button");b.type="button";b.textContent="★";
    b.className=i<=rating?"on":"";b.setAttribute("aria-label",i+"/5");b.setAttribute("aria-pressed",i===rating);
    b.onclick=()=>{rating=i;renderRate()};
    c.appendChild(b);
  }
}
$("#revOpen").onclick=()=>{const f=$("#revForm");f.hidden=!f.hidden;$("#revOpen").setAttribute("aria-expanded",!f.hidden);if(!f.hidden)$("#rName").focus()};
function shrinkImg(file,max=900){return new Promise((ok,ko)=>{
  const i=new Image();i.onload=()=>{
    const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");
    c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
    c.toBlob(b=>b?ok(b):ko(),"image/webp",.75);URL.revokeObjectURL(i.src);
  };i.onerror=ko;i.src=URL.createObjectURL(file);
})}
$("#revForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const n=$("#rName").value.trim(),tx=$("#rText").value.trim(),m=$("#rMsg"),btn=$("#revForm button[type=submit]");
  if($("#rWeb").value)return;
  if(!n||!tx||!rating){m.className="msg err";m.textContent=t("fNeed");return}
  if(Date.now()-store.get("lastRev",0)<30000){m.className="msg err";m.textContent=t("fErr");return}
  btn.disabled=true;m.className="msg";m.textContent=t("fSending");
  try{
    let image_url=null;const f=$("#rFile").files[0];
    if(f){
      const blob=await shrinkImg(f),name=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.webp`;
      const up=await fetch(`${SB_URL}/storage/v1/object/comentarios/${name}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"image/webp"},body:blob});
      if(!up.ok)throw new Error("upload");
      image_url=`${SB_URL}/storage/v1/object/public/comentarios/${name}`;
    }
    const r=await fetch(`${SB_URL}/rest/v1/comentarios`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({name:n.slice(0,40),rating,text:tx.slice(0,400),image_url,status:"pending"})});
    if(!r.ok)throw new Error("insert");
    store.set("lastRev",Date.now());
    $("#rName").value="";$("#rText").value="";$("#rFile").value="";rating=0;renderRate();
    m.className="msg";m.textContent=t("fPending");
    setTimeout(()=>{$("#revForm").hidden=true;$("#revOpen").setAttribute("aria-expanded","false")},3500);
  }catch(err){m.className="msg err";m.textContent=t("fErr")}
  btn.disabled=false;
});

/* ---------- Controles ---------- */
function setTheme(th){
  state.theme=th;document.documentElement.dataset.theme=th;store.set("theme",th);
}
$("#themeBtn").onclick=()=>setTheme(state.theme==="dark"?"light":"dark");
$("#langSel").onchange=e=>{state.lang=e.target.value;store.set("lang",state.lang);renderAll()};
$("#q").oninput=e=>{state.q=e.target.value;renderGrid()};
$("#sort").onchange=e=>{state.sort=e.target.value;renderGrid()};

function renderAll(){
  applyStatic();renderChips();renderBrands();renderFilters();renderSeason();renderGrid();fillModal();renderIg();renderRevs();renderRate();renderCart();
  $("#langSel").value=state.lang;
}

/* ---------- Init ---------- */
(function preloader(){
  const pre=$("#pre");if(!pre)return;
  if(!document.documentElement.classList.contains("pre")){pre.remove();return}
  let loaded=document.readyState==="complete",waited=false,done=false;
  const go=()=>{
    if(done||!loaded||!waited)return;done=true;
    pre.classList.add("out");
    document.documentElement.classList.remove("pre");
    setTimeout(()=>pre.remove(),650);
  };
  setTimeout(()=>{waited=true;go()},2150);
  setTimeout(()=>{loaded=true;go()},4500);
  if(!loaded)addEventListener("load",()=>{loaded=true;go()});
})();
(function init(){
  const savedTheme=store.get("theme",null);
  setTheme(savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
  const savedLang=store.get("lang",null);
  const nav=(navigator.language||"es").slice(0,2);
  state.lang=savedLang||(T[nav]?nav:"es");
  state.favs=store.get("favs",[]);
  myRevs=store.get("revs",[]).filter(x=>x&&typeof x.n==="string"&&typeof x.t==="string"&&x.r>=1&&x.r<=5);
  renderAll();
  loadProducts();
})();
</script>
